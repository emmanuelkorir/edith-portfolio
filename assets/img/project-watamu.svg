    <path d="M44 300c-30-54-76-80-122-90M46 286c6-64-10-112-44-152M48 316c46-40 96-52 146-46M46 338c54 18 94 50 120 96M40 318c-46 22-78 56-94 102" stroke="#3F5339" stroke-width="18" fill="none"/>
    <g fill="#4E6B4A">
      <path d="M44 300c-40-62-92-86-144-90 30 42 74 74 144 90z"/>
      <path d="M46 286c-4-66-26-112-66-148 8 62 24 112 66 148z"/>
      <path d="M48 316c50-46 104-58 164-48-40 38-92 56-164 48z"/>
      <path d="M46 338c58 20 102 54 128 104-62-10-108-38-128-104z"/>
      <path d="M40 318c-50 26-84 62-98 112 54-18 88-52 98-112z"/>
    </g>
    <g stroke="#1C1A16" stroke-opacity=".14" stroke-width="2">
      <path d="M44 300c-40-62-92-86-144-90M46 286c-4-66-26-112-66-148M48 316c50-46 104-58 164-48M46 338c58 20 102 54 128 104"/>
    </g>
    <g fill="#3F5339">
      <circle cx="48" cy="330" r="12"/><circle cx="30" cy="326" r="9"/><circle cx="64" cy="324" r="8"/>
    </g>
  </g>

  <g transform="translate(1440 660)">
    <path d="M0 540C-12 380-8 260-34 150" stroke="#5B4930" stroke-width="18" fill="none"/>
    <g fill="#4E6B4A">
      <path d="M-34 160c-44-30-84-32-120-12 34 26 74 32 120 12z"/>
      <path d="M-30 148c-8-44-34-74-72-88 12 42 36 72 72 88z"/>
      <path d="M-28 158c40-30 84-34 124-12-36 26-78 30-124 12z"/>
      <path d="M-30 170c34 16 58 44 68 84-38-12-62-38-68-84z"/>
    </g>
  </g>

  <!-- plants -->
  <g fill="#5D6B50">
    <path d="M960 1018c-16-36-10-68 14-96 12 34 6 66-14 96z"/>
    <path d="M990 1018c-6-28 2-50 22-68 4 28-4 52-22 68z"/>
    <path d="M936 1018c-10-24-4-44 10-60 4 24 0 42-10 60z"/>
  </g>

  <!-- people on deck -->
  <g fill="#1C1A16">
    <circle cx="700" cy="704" r="9"/>
    <path d="M691 714h18l4 46h-26z"/>
    <circle cx="742" cy="716" r="7"/>
    <path d="M735 724h14l3 30h-20z"/>
  </g>

  <!-- birds -->
  <g stroke="#1C1A16" stroke-width="2.5" fill="none" opacity=".45">
    <path d="M900 190c8-8 15-8 22 0 7-8 14-8 21 0"/>
    <path d="M980 158c6-6 12-6 17 0 5-6 11-6 17 0"/>
    <path d="M1060 214c6-6 11-6 16 0 5-6 10-6 15 0"/>
  </g>

  <!-- labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1C1A16">
    <text x="88" y="104" font-size="18" letter-spacing="4" opacity=".65">04 / RESIDENTIAL</text>
    <text x="88" y="136" font-size="15" letter-spacing="3.4" opacity=".5">WATAMU BEACH HOUSE</text>
    <text x="1512" y="1120" font-size="15" letter-spacing="3" text-anchor="end" opacity=".6">KILIFI · 2024</text>
    <text x="1512" y="1150" font-size="13" letter-spacing="2.6" text-anchor="end" opacity=".45">SCALE 1:150 / SHEET A-03</text>
  </g>
</svg>
