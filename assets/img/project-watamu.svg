<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Watamu Beach House</title>
  <desc id="desc">An elevated timber beach house on stilts above a dune, with deep eaves, a wide deck and coconut palms framing the Indian Ocean.</desc>
  <defs>
    <pattern id="c4-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#1C1A16" stroke-opacity=".048"/>
    </pattern>
    <pattern id="c4-grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".6" fill="#1C1A16" opacity=".28"/>
      <circle cx="5" cy="5.5" r=".5" fill="#1C1A16" opacity=".16"/>
    </pattern>
    <pattern id="c4-sea" width="220" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20h54M90 20h36M150 20h50" stroke="#F1EADB" stroke-opacity=".38" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="#F1E8D8"/>
  <rect width="1600" height="690" fill="#E7DCC7"/>
  <rect width="1600" height="690" fill="url(#c4-grid)"/>
  <circle cx="1260" cy="210" r="120" fill="#D89A6C" opacity=".9"/>

  <!-- sea -->
  <rect y="610" width="1600" height="250" fill="#7FA7A3"/>
  <rect y="610" width="1600" height="250" fill="url(#c4-sea)" opacity=".7"/>
  <path d="M0 610h1600" stroke="#1C1A16" stroke-opacity=".18"/>
  <g fill="#4E7A78" opacity=".35">
    <path d="M0 700c160-20 300-10 430 6s260 8 390-8 280-14 420 4 240 10 360-4v52H0z"/>
  </g>

  <!-- beach -->
  <path d="M0 820c220-44 390-30 560 6s330 36 520-2 330-34 520 10v366H0z" fill="#E3CFAD"/>
  <path d="M0 850c240-30 410-16 580 14s340 28 520-8 300-32 500 6v20c-200-38-330-24-500 10s-350 22-520-10-340-42-580-10z" fill="#D8C09A" opacity=".7"/>

  <!-- dune grass -->
  <g stroke="#6E7B5A" stroke-width="4" fill="none">
    <path d="M40 1200c10-100 18-172 40-236M80 1200c-2-96-14-168-36-228M120 1200c20-84 44-150 76-206M160 1200c-10-80-26-142-52-198M260 1200c14-72 34-128 62-178"/>
    <path d="M1220 1200c8-76 20-134 42-184M1260 1200c-2-70-10-124-28-170M1300 1200c18-66 38-120 66-166M1340 1200c-8-62-22-112-42-154"/>
  </g>

  <!-- house stilts and deck -->
  <g fill="#4B3E2C">
    <rect x="520" y="806" width="20" height="220"/>
    <rect x="690" y="806" width="20" height="220"/>
    <rect x="870" y="806" width="20" height="220"/>
    <rect x="1040" y="806" width="20" height="220"/>
    <rect x="1200" y="806" width="20" height="220"/>
  </g>
  <g stroke="#1C1A16" stroke-width="3" opacity=".25">
    <path d="M500 1026h740" />
  </g>
  <rect x="480" y="790" width="780" height="28" fill="#B98A5C"/>
  <rect x="480" y="818" width="780" height="18" fill="#8F6743"/>
  <g stroke="#1C1A16" stroke-opacity=".18">
    <path d="M560 790v28M640 790v28M720 790v28M800 790v28M880 790v28M960 790v28M1040 790v28M1120 790v28M1200 790v28"/>
  </g>

  <!-- lower level -->
  <rect x="520" y="640" width="700" height="150" fill="#7E5A3B"/>
  <rect x="520" y="640" width="700" height="150" fill="url(#c4-grain)" opacity=".22"/>
  <g stroke="#1C1A16" stroke-width="3" opacity=".3">
    <path d="M520 690h700M520 740h700"/>
  </g>
  <g fill="#2F2B24">
