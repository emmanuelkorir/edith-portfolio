  <g fill="#B98A5C" stroke="#1C1A16" stroke-opacity=".25">
    <path d="M1110 790h120v22h-120z"/>
    <path d="M1140 812h120v22h-120z"/>
    <path d="M1170 834h120v22h-120z"/>
    <path d="M1200 856h120v22h-120z"/>
    <path d="M1230 878h120v22h-120z"/>
    <path d="M1260 900h120v22h-120z"/>
