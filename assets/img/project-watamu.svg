    <rect x="1030" y="450" width="120" height="170"/>
  </g>
  <g stroke="#E3CFAD" stroke-width="3" opacity=".35">
    <path d="M600 454v162M620 454v162M640 454v162M660 454v162M680 454v162M700 454v162M1048 454v162M1068 454v162M1088 454v162M1108 454v162M1128 454v162"/>
  </g>
  <!-- glazing -->
  <g fill="#31403B">
    <rect x="730" y="450" width="280" height="170"/>
  </g>
  <g stroke="#D8C09A" stroke-width="3" opacity=".45">
    <path d="M800 450v170M870 450v170M940 450v170M730 535h280"/>
  </g>
  <rect x="730" y="450" width="280" height="170" fill="#C97B5A" opacity=".16"/>

  <!-- roof -->
  <path d="M510 430h720l-44-58H554z" fill="#3E352A"/>
  <path d="M510 430h720l-10 18H520z" fill="#1C1A16"/>
  <g stroke="#1C1A16" stroke-width="2" opacity=".25">
    <path d="M554 372h632M560 390h620"/>
  </g>

  <!-- deck rails -->
  <g stroke="#4B3E2C" stroke-width="4">
    <path d="M480 790v-54M1260 790v-54M480 736h780M500 764h740"/>
  </g>
  <g stroke="#4B3E2C" stroke-width="3" opacity=".8">
    <path d="M560 736v54M640 736v54M720 736v54M800 736v54M880 736v54M960 736v54M1040 736v54M1120 736v54M1200 736v54"/>
  </g>

