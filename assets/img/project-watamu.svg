  <rect x="560" y="430" width="620" height="210" fill="#C08A5E"/>
  <rect x="560" y="430" width="620" height="210" fill="url(#c4-grain)" opacity=".16"/>
  <g stroke="#1C1A16" stroke-width="2" opacity=".25">
    <path d="M560 474h620M560 518h620M560 562h620M560 606h620"/>
