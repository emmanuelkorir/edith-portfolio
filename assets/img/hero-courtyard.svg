<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Courtyard house study, Nairobi</title>
  <desc id="desc">An illustrated elevation of a modern courtyard house with a deep veranda, breeze-block screen, planting and a warm terracotta sun.</desc>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#1C1A16" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="breeze" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#6E7B63"/>
      <circle cx="24" cy="24" r="11" fill="#E9E2D3"/>
      <path d="M24 0v10M24 38v10M0 24h10M38 24h10" stroke="#E9E2D3" stroke-width="7"/>
    </pattern>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".65" fill="#1C1A16" opacity=".35"/>
      <circle cx="5" cy="5.5" r=".5" fill="#1C1A16" opacity=".2"/>
    </pattern>
    <clipPath id="arch">
      <path d="M417 1134V931a63 63 0 0 1 126 0v203z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1500" fill="#E9E2D3"/>
  <rect width="1200" height="1126" fill="#E3DBCA"/>
  <rect width="1200" height="1126" fill="url(#grid)"/>

  <!-- sun and horizon -->
  <circle cx="938" cy="292" r="168" fill="#BC6644"/>
  <circle cx="938" cy="292" r="168" fill="none" stroke="#1C1A16" stroke-opacity=".12"/>
  <path d="M0 1052h1200" stroke="#1C1A16" stroke-opacity=".18"/>

  <!-- distant landscape -->
  <path d="M0 1030c120-38 210-26 300-6s180 12 280-6 220-8 320 8 190 14 300-4v130H0z" fill="#B9C0A9" opacity=".75"/>
  <path d="M0 1070c150-22 250-4 370 8s250 4 380-10 250-6 450 12v90H0z" fill="#A8B198" opacity=".55"/>

  <!-- upper volume -->
  <rect x="112" y="424" width="548" height="424" fill="#D8C6A6"/>
  <rect x="112" y="424" width="548" height="424" fill="url(#grain)" opacity=".16"/>
  <rect x="86" y="394" width="600" height="30" fill="#1C1A16"/>
  <rect x="86" y="424" width="600" height="12" fill="#B7A280"/>
  <rect x="112" y="424" width="26" height="424" fill="#CDB894"/>

  <!-- louvred windows -->
  <g>
    <rect x="176" y="508" width="112" height="222" fill="#2F2C25"/>
    <rect x="310" y="508" width="112" height="222" fill="#2F2C25"/>
    <rect x="444" y="508" width="112" height="222" fill="#2F2C25"/>
    <g stroke="#D8C6A6" stroke-width="3" opacity=".55">
      <path d="M176 536h112M176 562h112M176 588h112M176 614h112M176 640h112M176 666h112M176 692h112M176 718h112"/>
      <path d="M310 536h112M310 562h112M310 588h112M310 614h112M310 640h112M310 666h112M310 692h112M310 718h112"/>
      <path d="M444 536h112M444 562h112M444 588h112M444 614h112M444 640h112M444 666h112M444 692h112M444 718h112"/>
    </g>
    <rect x="444" y="508" width="112" height="222" fill="#C58C53" opacity=".35"/>
    <path d="M500 508v222M444 619h112" stroke="#1C1A16" stroke-width="2" opacity=".4"/>
  </g>

  <!-- lower volume and veranda -->
  <rect x="112" y="848" width="548" height="282" fill="#EFE7D7"/>
  <rect x="112" y="848" width="212" height="282" fill="#332F27"/>
  <path d="M324 848h12v282h-12z" fill="#1C1A16" opacity=".35"/>
  <rect x="112" y="848" width="212" height="282" fill="url(#grain)" opacity=".22"/>
  <rect x="148" y="890" width="140" height="196" fill="#C69157"/>
  <path d="M148 890h140v196H148z" fill="none" stroke="#1C1A16" stroke-width="2" opacity=".28"/>
  <path d="M148 986h140M218 890v196" stroke="#1C1A16" stroke-width="1.5" opacity=".22"/>

  <!-- arch -->
  <path d="M417 1134V931a63 63 0 0 1 126 0v203z" fill="#B77F4C"/>
  <g clip-path="url(#arch)">
    <rect x="417" y="1020" width="126" height="114" fill="#8C5D37"/>
    <circle cx="500" cy="1048" r="9" fill="#1C1A16" opacity=".65"/>
    <path d="M462 1134v-46a38 38 0 0 1 76 0v46z" fill="#1C1A16" opacity=".3"/>
