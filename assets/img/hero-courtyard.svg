  <rect x="704" y="620" width="392" height="510" fill="#6E7B63"/>
  <rect x="704" y="620" width="392" height="510" fill="url(#breeze)"/>
  <rect x="680" y="588" width="440" height="32" fill="#1C1A16"/>
  <rect x="680" y="620" width="24" height="510" fill="#55614D"/>
  <g stroke="#1C1A16" stroke-width="3" opacity=".55">
    <path d="M704 668h392M704 764h392M704 860h392M704 956h392M704 1052h392"/>
  </g>
  <rect x="704" y="1010" width="392" height="120" fill="#31403B"/>
  <g stroke="#8EA098" stroke-width="2" opacity=".55">
    <path d="M786 1010v120M868 1010v120M950 1010v120M1032 1010v120"/>
  </g>
  <path d="M704 1010h392" stroke="#1C1A16" stroke-width="3"/>

  <!-- terrace -->
  <rect y="1130" width="1200" height="216" fill="#CCB896"/>
  <path d="M0 1130h1200" stroke="#1C1A16" stroke-width="3"/>
  <g stroke="#1C1A16" stroke-opacity=".14" stroke-width="1.5">
    <path d="M0 1182h1200M0 1254h1200M92 1130v216M262 1130v216M432 1130v216M602 1130v216M772 1130v216M942 1130v216M1112 1130v216"/>
  </g>
  <path d="M300 1130h596v22H300z" fill="#BFA985"/>

  <!-- planting -->
  <g>
    <path d="M70 1128c0-84 22-146 56-188 28 51 36 116 30 188z" fill="#465440"/>
    <path d="M104 1128c-8-92 0-160 22-206 38 56 52 130 46 206z" fill="#5C6B51"/>
    <path d="M104 948v180" stroke="#2F392C" stroke-width="5"/>
    <path d="M104 1002c-28-26-46-44-62-78M104 1042c26-22 44-46 54-82M104 986c16-32 20-60 18-94" fill="none" stroke="#2F392C" stroke-width="5"/>
  </g>
  <g>
    <path d="M1114 1130c-4-70 12-124 44-162 24 44 30 100 24 162z" fill="#4B5A45"/>
    <path d="M1152 1130c-10-56-6-104 10-140 28 38 38 86 34 140z" fill="#68765A"/>
    <path d="M1136 980v150" stroke="#2F392C" stroke-width="4"/>
  </g>
  <g fill="#5D6B50">
    <path d="M660 1128c-14-26-14-48 0-70 14 22 14 44 0 70z"/>
    <path d="M682 1128c-8-20-4-38 10-54 8 18 4 36-10 54z"/>
    <path d="M640 1128c-10-18-8-34 4-48 8 14 6 30-4 48z"/>
    <path d="M700 1128c-6-14-2-28 8-40 6 14 2 28-8 40z"/>
  </g>

  <!-- human scale -->
  <g fill="#1C1A16">
    <circle cx="836" cy="1068" r="8"/>
    <path d="M828 1078h16l4 52h-24z"/>
    <path d="M832 1080l-6 52M840 1080l8 52" stroke="#1C1A16" stroke-width="4"/>
    <circle cx="878" cy="1076" r="7"/>
    <path d="M871 1085h14l3 45h-20z"/>
    <path d="M874 1087l-4 43M882 1087l6 43" stroke="#1C1A16" stroke-width="3.5"/>
  </g>

  <!-- drawing annotations -->
  <g stroke="#1C1A16" stroke-opacity=".5" fill="none">
    <path d="M86 1290v-38M686 1290v-38M86 1272h600"/>
    <path d="M86 1266v12M686 1266v12"/>
    <path d="M1120 620h38M1120 1130h38M1140 620v510"/>
    <path d="M1134 620h12M1134 1130h12"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#1C1A16" opacity=".72">
    <text x="352" y="1254" text-anchor="middle">18.0 M</text>
    <text x="1170" y="880" transform="rotate(-90 1170 880)" text-anchor="middle">9.4 M</text>
    <text x="140" y="366">COURTYARD HOUSE / NAIROBI</text>
    <text x="1104" y="666" text-anchor="end">BREEZE-BLOCK SCREEN</text>
    <text x="438" y="1178" fill="#EFE7D7" opacity="1">VERANDA</text>
  </g>
  <g stroke="#1C1A16" stroke-width="2" opacity=".7">
    <path d="M694 640l10 10M704 640l-10 10"/>
    <path d="M140 382h12M146 376v12"/>
  </g>

  <!-- title block -->
  <path d="M0 1346h1200" stroke="#1C1A16" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1C1A16">
    <text x="80" y="1412" font-size="46" letter-spacing="-1">Edith Nduta Kuria</text>
    <text x="82" y="1446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3.2" opacity=".65">ARCHITECT · NAIROBI, KENYA</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#1C1A16" opacity=".7">
    <text x="790" y="1392">SELECTED WORK</text>
    <text x="790" y="1414">2021—2025</text>
    <text x="980" y="1392">SHEET A-01</text>
    <text x="980" y="1414">SCALE 1:100</text>
    <text x="1090" y="1392">1°17′S</text>
    <text x="1090" y="1414">36°49′E</text>
  </g>
  <path d="M760 1368v110M958 1368v110M1070 1368v110" stroke="#1C1A16" stroke-opacity=".25"/>
  <g stroke="#1C1A16" opacity=".5">
    <path d="M80 1462h1040" stroke-width="1"/>
    <path d="M80 1466h1040" stroke-width="3"/>
  </g>
</svg>
