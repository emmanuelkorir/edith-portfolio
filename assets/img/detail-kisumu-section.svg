<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lakefront Reading Room — long section</title>
  <desc id="desc">A long section through the reading pavilion showing the deep roof, timber columns, book shelves and the lake beyond.</desc>
  <defs>
    <pattern id="p2-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1C1A16" stroke-opacity=".045"/>
    </pattern>
    <pattern id="p2-water" width="160" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 15h40M70 15h30M120 15h30" stroke="#1C1A16" stroke-opacity=".2" stroke-width="2"/>
    </pattern>
    <pattern id="p2-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v10" stroke="#1C1A16" stroke-opacity=".28" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1400" height="1000" fill="#F0EBDD"/>
  <rect width="1400" height="1000" fill="url(#p2-grid)"/>
  <rect x="40" y="40" width="1320" height="920" fill="none" stroke="#1C1A16" stroke-opacity=".2"/>

  <text x="80" y="120" font-family="Georgia, serif" font-size="44" fill="#1C1A16">A room that opens</text>
  <text x="80" y="166" font-family="Georgia, serif" font-size="44" font-style="italic" fill="#2F4A46">to the water.</text>
  <text x="80" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.6" fill="#1C1A16" opacity=".55">LONG SECTION B–B / 1:150</text>

  <!-- water -->
  <rect x="80" y="700" width="1240" height="160" fill="#A8BDB6"/>
  <rect x="80" y="700" width="1240" height="160" fill="url(#p2-water)" opacity=".7"/>
  <path d="M80 700h1240" stroke="#1C1A16" stroke-width="3"/>

  <!-- deck -->
  <rect x="120" y="680" width="1160" height="20" fill="#B79B6E"/>
  <rect x="120" y="700" width="1160" height="30" fill="#8B7350"/>
  <g stroke="#4D3F2C" stroke-width="8">
    <path d="M160 700v110M360 700v110M560 700v110M760 700v110M960 700v110M1160 700v110M1240 700v110"/>
  </g>

  <!-- pavilion section -->
  <rect x="180" y="440" width="1040" height="240" fill="#F3EEE2"/>
  <rect x="180" y="440" width="1040" height="240" fill="none" stroke="#1C1A16" stroke-width="4"/>
  <rect x="180" y="440" width="20" height="240" fill="url(#p2-hatch)"/>
  <rect x="1200" y="440" width="20" height="240" fill="url(#p2-hatch)"/>
  <rect x="180" y="620" width="1040" height="60" fill="#D8C8A9"/>
  <path d="M180 620h1040" stroke="#1C1A16" stroke-width="3"/>

  <!-- interior -->
  <g fill="#C9A66B">
    <rect x="230" y="470" width="940" height="14"/>
    <rect x="230" y="560" width="940" height="10"/>
  </g>
  <g fill="#6E5A3A" opacity=".8">
    <rect x="250" y="500" width="12" height="34"/><rect x="270" y="506" width="9" height="28"/><rect x="286" y="496" width="14" height="38"/><rect x="306" y="508" width="10" height="26"/><rect x="322" y="502" width="12" height="32"/>
    <rect x="900" y="500" width="12" height="34"/><rect x="920" y="508" width="9" height="26"/><rect x="936" y="498" width="14" height="36"/><rect x="956" y="506" width="10" height="28"/>
  </g>
  <g fill="#C9A66B" opacity=".65">
    <rect x="350" y="540" width="260" height="8"/>
    <rect x="350" y="580" width="160" height="8"/>
    <rect x="820" y="540" width="240" height="8"/>
  </g>

  <!-- columns -->
  <g fill="#1C1A16">
    <rect x="360" y="440" width="14" height="240"/>
    <rect x="620" y="440" width="14" height="240"/>
    <rect x="880" y="440" width="14" height="240"/>
  </g>

  <!-- roof -->
  <path d="M130 440h1140l-40-60H170z" fill="#1C1A16"/>
  <rect x="130" y="440" width="1140" height="16" fill="#3C3830"/>
  <path d="M130 456h1140" stroke="#1C1A16" stroke-width="2"/>
  <g stroke="#C9A66B" stroke-width="2" opacity=".45">
    <path d="M170 380h1060"/>
  </g>

  <!-- people -->
  <g fill="#1C1A16">
    <circle cx="470" cy="600" r="9"/>
    <path d="M461 610h18l4 40h-26z"/>
    <circle cx="690" cy="594" r="8"/>
    <path d="M682 603h16l3 44h-22z"/>
    <circle cx="980" cy="604" r="8"/>
    <path d="M972 613h16l3 34h-22z"/>
  </g>
  <g fill="#2F4A46" opacity=".4">
    <rect x="490" y="604" width="80" height="8"/>
    <rect x="710" y="608" width="70" height="8"/>
    <rect x="1000" y="608" width="60" height="8"/>
  </g>

  <!-- reeds -->
  <g stroke="#5E6C4A" stroke-width="3" fill="none">
    <path d="M90 860c10-90 20-150 40-200M120 860c0-80-6-140-20-190M150 860c14-70 30-120 52-164M1180 860c12-78 28-136 54-184M1220 860c-2-72-10-126-26-174M1260 860c16-64 34-114 58-156"/>
  </g>
  <g fill="#7A6A3F">
    <ellipse cx="130" cy="664" rx="7" ry="20"/><ellipse cx="140" cy="678" rx="6" ry="18"/>
    <ellipse cx="1236" cy="684" rx="7" ry="20"/><ellipse cx="1246" cy="700" rx="6" ry="18"/>
  </g>

  <!-- annotations -->
  <g stroke="#1C1A16" stroke-opacity=".4">
    <path d="M620 340v-40h240M860 300v40"/>
    <path d="M180 260v-40M1220 260v-40M180 240h1040"/>
    <path d="M1340 440h20M1340 680h20M1354 440v240"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#1C1A16" opacity=".55">
    <text x="740" y="288" text-anchor="middle">DEEP ROOF / 2.4 M OVERHANG</text>
    <text x="700" y="228" text-anchor="middle">11.2 M CLEAR SPAN</text>
    <text x="1378" y="564" transform="rotate(-90 1378 564)" text-anchor="middle">4.1 M</text>
    <text x="300" y="740" fill="#1C1A16" opacity=".75">TIMBER PIER ABOVE LAKE</text>
    <text x="900" y="742" fill="#1C1A16" opacity=".75">CROSS VENTILATION</text>
  </g>
  <g fill="none" stroke="#B46544" stroke-width="3">
    <path d="M1080 500c-20-20-20-40 0-60M1100 500c-20-20-20-40 0-60" opacity=".8"/>
  </g>

  <!-- title block -->
  <path d="M40 910h1320" stroke="#1C1A16" stroke-opacity=".4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#1C1A16" opacity=".6">
    <text x="60" y="948">LAKEFRONT READING ROOM</text>
    <text x="60" y="972">KISUMU, KENYA</text>
    <text x="620" y="948">DRAWING A-204</text>
    <text x="620" y="972">SCALE 1:150</text>
    <text x="1060" y="948">EDITH NDUTA KURIA</text>
    <text x="1060" y="972">2024</text>
  </g>
</svg>
