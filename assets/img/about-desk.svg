<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1375" role="img" aria-labelledby="title desc">
  <title id="title">The architect's desk</title>
  <desc id="desc">An illustrated overhead view of a drafting desk with a floor plan, rolled drawings, a scale ruler, pencils, a model and a plant.</desc>
  <defs>
    <pattern id="desk-grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".7" fill="#1C1A16" opacity=".3"/>
      <circle cx="6" cy="6" r=".5" fill="#1C1A16" opacity=".18"/>
    </pattern>
    <pattern id="desk-grid" width="55" height="55" patternUnits="userSpaceOnUse">
      <path d="M55 0H0V55" fill="none" stroke="#1C1A16" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="roll-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C97E5B"/>
      <stop offset=".45" stop-color="#B46544"/>
      <stop offset="1" stop-color="#8E4A2F"/>
    </linearGradient>
    <linearGradient id="roll-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C9A7D"/>
      <stop offset=".45" stop-color="#6C7B61"/>
      <stop offset="1" stop-color="#4F5C48"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="1375" fill="#E7DFCF"/>
  <rect width="1100" height="1375" fill="url(#desk-grid)"/>
  <rect width="1100" height="1375" fill="url(#desk-grain)" opacity=".35"/>
  <rect x="46" y="46" width="1008" height="1283" fill="none" stroke="#1C1A16" stroke-opacity=".18"/>

  <!-- sheet shadow -->
  <g transform="rotate(-5 450 640)">
    <rect x="106" y="244" width="690" height="800" fill="#1C1A16" opacity=".13"/>
    <rect x="86" y="224" width="690" height="800" fill="#F3EDE0"/>
    <rect x="86" y="224" width="690" height="800" fill="none" stroke="#1C1A16" stroke-opacity=".35" stroke-width="2"/>
    <path d="M96 234h670v780H96z" fill="none" stroke="#1C1A16" stroke-opacity=".12"/>

    <!-- drawing frame -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1C1A16" opacity=".75">
      <text x="118" y="270" font-size="13" letter-spacing="2.6">THESIS 2024/25</text>
      <text x="744" y="270" font-size="13" letter-spacing="2.6" text-anchor="end">PLAN 1:100</text>
      <text x="118" y="990" font-size="13" letter-spacing="2.6">THE SHARED THRESHOLD</text>
      <text x="744" y="990" font-size="13" letter-spacing="2.6" text-anchor="end">SHEET A-02</text>
    </g>
    <path d="M112 284h638M112 966h638" stroke="#1C1A16" stroke-opacity=".35"/>

    <!-- floor plan -->
    <g stroke="#1C1A16">
      <!-- outer walls -->
      <path d="M168 360h420v470H168z" fill="none" stroke-width="9"/>
      <path d="M168 360h420v470H168z" fill="#1C1A16" opacity=".04" stroke="none"/>
      <!-- inner partitions -->
      <g stroke-width="5" fill="none">
        <path d="M168 540h180M348 540v150M348 690h-180"/>
        <path d="M468 360v280M468 720v110"/>
        <path d="M348 830v-140"/>
        <path d="M588 500v210"/>
        <path d="M468 760h120"/>
      </g>
      <!-- courtyard -->
      <rect x="486" y="612" width="168" height="118" fill="#CBD4C0" stroke-width="5"/>
      <g stroke="#5B6B50" stroke-width="3" opacity=".9">
        <path d="M510 700c10-34 26-58 44-70M536 706c4-30 16-52 32-64M566 710c-4-26 4-48 18-62M590 710c8-22 22-38 38-46"/>
      </g>
      <circle cx="556" cy="658" r="20" fill="#7E8B70" stroke="none"/>
      <circle cx="548" cy="650" r="11" fill="#96A287" stroke="none"/>
      <!-- door swings -->
      <g stroke-width="2" fill="none" opacity=".75">
        <path d="M360 540a54 54 0 0 1 54 54M468 720a40 40 0 0 0-40-40M348 690a46 46 0 0 0-46-46"/>
      </g>
      <!-- furniture -->
      <g stroke-width="2.4" fill="none" opacity=".7">
        <rect x="196" y="392" width="120" height="58"/>
        <rect x="196" y="470" width="58" height="38"/>
        <rect x="226" y="742" width="96" height="60"/>
        <rect x="492" y="386" width="140" height="48"/>
        <rect x="504" y="470" width="116" height="30"/>
        <circle cx="392" cy="798" r="30"/>
        <rect x="616" y="770" width="54" height="54"/>
      </g>
    </g>
    <!-- north arrow -->
    <g transform="translate(700 940)">
      <circle r="20" fill="none" stroke="#1C1A16" stroke-opacity=".45"/>
      <path d="M0-16 7 8 0 3-7 8z" fill="#1C1A16" opacity=".7"/>
      <text y="-28" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1C1A16" opacity=".7">N</text>
    </g>
    <!-- room labels -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8" fill="#1C1A16" opacity=".55">
      <text x="212" y="430">LIVING</text>
      <text x="212" y="520">COURT</text>
      <text x="380" y="620">SLEEP</text>
      <text x="380" y="812">KITCHEN</text>
      <text x="612" y="620">STUDIO</text>
      <text x="500" y="756">COURTYARD</text>
      <text x="700" y="918">ENTRY</text>
    </g>
    <g stroke="#1C1A16" stroke-width="1.5" opacity=".35">
      <path d="M168 900h420"/>
      <path d="M168 894v12M288 894v12M408 894v12M528 894v12M588 894v12"/>
    </g>
    <text x="378" y="926" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#1C1A16" opacity=".55">0        5        10 M</text>
  </g>

  <!-- rolled drawings -->
  <g transform="translate(790 190) rotate(-16)">
    <rect x="0" y="0" width="240" height="52" rx="26" fill="url(#roll-a)"/>
    <ellipse cx="240" cy="26" rx="15" ry="26" fill="#D8916D"/>
    <ellipse cx="240" cy="26" rx="8" ry="17" fill="#7A3D27" opacity=".65"/>
    <path d="M18 0v52" stroke="#1C1A16" stroke-opacity=".2" stroke-width="3"/>
    <path d="M64 0v52M176 0v52" stroke="#1C1A16" stroke-opacity=".12"/>
  </g>
  <g transform="translate(818 282) rotate(-9)">
    <rect x="0" y="0" width="210" height="44" rx="22" fill="url(#roll-b)"/>
    <ellipse cx="210" cy="22" rx="13" ry="22" fill="#B6C0A7"/>
    <ellipse cx="210" cy="22" rx="7" ry="14" fill="#38452F" opacity=".65"/>
  </g>

  <!-- plant -->
  <g transform="translate(892 700)">
    <ellipse cx="0" cy="196" rx="86" ry="16" fill="#1C1A16" opacity=".12"/>
    <path d="M-48 104h96l-12 88h-72z" fill="#B46544"/>
    <path d="M-48 104h96v14h-96z" fill="#8E4A2F"/>
    <g fill="#4E5C45">
      <path d="M0 104C-8 40-44 6-78-6c4 44 26 82 78 110z"/>
      <path d="M6 104C24 42 62 18 96 14 84 58 56 90 6 104z"/>
      <path d="M-2 102C-22 56-20 18 0-18c20 38 22 78 2 120z" fill="#647257"/>
      <path d="M-20 100C-54 74-70 46-76 14c36 12 60 40 70 86z" fill="#43513C"/>
      <path d="M26 100c34-20 54-48 62-84-38 8-62 36-72 84z" fill="#75836A"/>
    </g>
    <g stroke="#2F392C" stroke-width="3" fill="none">
      <path d="M0 104c-4-46-28-82-60-98M4 104c16-48 44-74 74-82M0 104c-8-52-4-92 8-114"/>
    </g>
  </g>

  <!-- coffee -->
  <g transform="translate(920 1000)">
    <ellipse cx="0" cy="10" rx="62" ry="18" fill="#1C1A16" opacity=".12"/>
    <circle r="52" fill="#F1EADB"/>
    <circle r="52" fill="none" stroke="#1C1A16" stroke-opacity=".25"/>
    <circle r="38" fill="#4B3425"/>
    <circle r="30" fill="#5C4030"/>
    <path d="M-18 6c8-10 18-10 26 0s18 10 26 0" fill="none" stroke="#C9B49C" stroke-width="3" opacity=".75"/>
    <path d="M52 0a20 20 0 0 1 0 28" fill="none" stroke="#1C1A16" stroke-opacity=".3" stroke-width="5"/>
  </g>

  <!-- pencils -->
  <g transform="translate(120 1090) rotate(24)">
    <rect x="0" y="0" width="250" height="16" fill="#C9A24E"/>
    <path d="M250 0l34 8-34 8z" fill="#E8D9BE"/>
    <path d="M274 5.5 284 8l-10 2.5z" fill="#1C1A16"/>
    <rect x="0" y="0" width="26" height="16" fill="#B46544"/>
    <rect x="26" y="0" width="6" height="16" fill="#1C1A16" opacity=".35"/>
  </g>
  <g transform="translate(140 1144) rotate(18)">
    <rect x="0" y="0" width="205" height="12" fill="#6E7B63"/>
    <path d="M205 0l28 6-28 6z" fill="#E8D9BE"/>
    <path d="M224 4.5 233 6l-9 1.5z" fill="#1C1A16"/>
    <rect x="0" y="0" width="20" height="12" fill="#1C1A16" opacity=".5"/>
  </g>

  <!-- scale ruler -->
  <g transform="translate(650 1120) rotate(-8)">
    <path d="M0 0h360l-20 30H20z" fill="#D9C49E"/>
    <path d="M0 0h360l-8 12H8z" fill="#C6AE83"/>
    <path d="M0 0h360l-20 30H20z" fill="none" stroke="#1C1A16" stroke-opacity=".3"/>
    <g stroke="#1C1A16" stroke-opacity=".55" stroke-width="1.5">
      <path d="M40 0v12M80 0v8M120 0v12M160 0v8M200 0v12M240 0v8M280 0v12M320 0v8"/>
      <path d="M40 30v-8M120 30v-12M200 30v-8M280 30v-12"/>
    </g>
    <text x="40" y="26" font-family="ui-monospace, monospace" font-size="10" fill="#1C1A16" opacity=".55">SCALE 1:100</text>
  </g>

  <!-- model block -->
  <g transform="translate(120 1210)">
    <path d="M0 48 68 14l92 34-68 40z" fill="#CBB692"/>
    <path d="M0 48v22l92 34V88z" fill="#A88F68"/>
    <path d="M92 88v16l68-40V40z" fill="#8B7554"/>
    <path d="M22 47 68 26l58 22-46 28z" fill="#E4D6BD"/>
    <path d="M60 44v22M86 32v22M104 54v20" stroke="#1C1A16" stroke-width="1.5" opacity=".35"/>
    <path d="M0 48 68 14l92 34-68 40z" fill="none" stroke="#1C1A16" stroke-width="1.5" opacity=".45"/>
    <text x="16" y="128" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#1C1A16" opacity=".5">MASSING / 1:200</text>
  </g>

  <!-- loose notes -->
  <g transform="translate(720 1180) rotate(6)">
    <rect x="0" y="0" width="180" height="120" fill="#F1E9D9" stroke="#1C1A16" stroke-opacity=".2"/>
    <g stroke="#1C1A16" stroke-opacity=".25">
      <path d="M18 30h144M18 48h144M18 66h112M18 84h132"/>
    </g>
    <path d="M18 102h64" stroke="#B46544" stroke-width="3"/>
  </g>

  <!-- tape -->
  <g fill="#D8C8A8" opacity=".9">
    <path d="M76 216l70 12-8 30-72-10z"/>
    <path d="M760 1000l64-16 8 28-66 16z"/>
  </g>
</svg>
