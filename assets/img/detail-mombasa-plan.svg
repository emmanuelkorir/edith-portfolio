<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Old Town Hostel — site plan</title>
  <desc id="desc">A site plan of the narrow Swahili townhouse plot, showing rooms arranged around a shaded courtyard and the street beyond.</desc>
  <defs>
    <pattern id="p5-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1C1A16" stroke-opacity=".045"/>
    </pattern>
    <pattern id="p5-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v10" stroke="#1C1A16" stroke-opacity=".22" stroke-width="1.5"/>
    </pattern>
    <pattern id="p5-court" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#C6D0BC"/>
      <path d="M0 17h34M17 0v34" stroke="#1C1A16" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1400" height="1000" fill="#F3EDE0"/>
  <rect width="1400" height="1000" fill="url(#p5-grid)"/>
  <rect x="40" y="40" width="1320" height="920" fill="none" stroke="#1C1A16" stroke-opacity=".2"/>

  <text x="80" y="120" font-family="Georgia, serif" font-size="44" fill="#1C1A16">A cool room</text>
  <text x="80" y="166" font-family="Georgia, serif" font-size="44" font-style="italic" fill="#2E4057">in a hot city.</text>
  <text x="80" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.6" fill="#1C1A16" opacity=".55">SITE PLAN / 1:100</text>

  <!-- street -->
  <rect x="80" y="760" width="1240" height="120" fill="#D8C8A9"/>
  <path d="M80 760h1240" stroke="#1C1A16" stroke-width="3"/>
  <g stroke="#1C1A16" stroke-opacity=".12">
    <path d="M80 820h1240M80 876h1240"/>
  </g>
  <text x="120" y="806" font-family="ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#1C1A16" opacity=".5">OLD TOWN STREET</text>

  <!-- neighbours -->
  <rect x="150" y="260" width="160" height="500" fill="#E0D5C0"/>
  <rect x="150" y="260" width="160" height="500" fill="url(#p5-hatch)" opacity=".35"/>
  <rect x="1100" y="220" width="180" height="540" fill="#E0D5C0"/>
  <rect x="1100" y="220" width="180" height="540" fill="url(#p5-hatch)" opacity=".35"/>
  <text x="230" y="520" transform="rotate(-90 230 520)" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#1C1A16" opacity=".45">NEIGHBOUR</text>
  <text x="1190" y="500" transform="rotate(-90 1190 500)" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#1C1A16" opacity=".45">NEIGHBOUR</text>

  <!-- plot -->
  <rect x="360" y="240" width="700" height="520" fill="#F7F1E5" stroke="#1C1A16" stroke-width="3" stroke-dasharray="10 6"/>
  <g fill="none" stroke="#1C1A16" stroke-width="10">
    <path d="M380 260h660v480H380z"/>
  </g>
  <g fill="none" stroke="#1C1A16" stroke-width="6">
    <path d="M380 420h180M560 420v120M560 540H380"/>
    <path d="M900 260v160M900 540v200M760 540h140"/>
    <path d="M380 660h200M580 660v80"/>
  </g>

  <!-- courtyard -->
  <rect x="600" y="420" width="280" height="220" fill="url(#p5-court)" stroke="#1C1A16" stroke-width="6"/>
  <g fill="#6E7D5D">
    <circle cx="680" cy="510" r="30"/>
    <circle cx="674" cy="504" r="18" fill="#8A977C"/>
    <path d="M760 610c-8-30 0-56 20-76 12 30 4 56-20 76z"/>
    <path d="M790 610c-4-22 4-40 24-54 2 22-6 40-24 54z"/>
  </g>
  <g fill="none" stroke="#4E5C45" stroke-width="2">
    <path d="M620 600c10-24 24-42 44-54M860 600c-6-22-18-40-36-54"/>
  </g>
  <text x="740" y="400" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#1C1A16" opacity=".55">COURTYARD</text>

  <!-- stairs -->
  <g fill="#C9A88A" stroke="#1C1A16" stroke-width="2">
    <rect x="920" y="430" width="90" height="18"/>
    <rect x="920" y="448" width="90" height="18"/>
    <rect x="920" y="466" width="90" height="18"/>
    <rect x="920" y="484" width="90" height="18"/>
    <rect x="920" y="502" width="90" height="18"/>
  </g>
  <path d="M1010 520l30-20" stroke="#1C1A16" stroke-width="3"/>

  <!-- entry -->
  <g>
    <rect x="660" y="660" width="120" height="80" fill="#6E4A34"/>
    <rect x="676" y="676" width="88" height="64" fill="#2E4057"/>
    <path d="M660 740h120" stroke="#1C1A16" stroke-width="4"/>
    <g fill="#C9A66B">
      <circle cx="700" cy="700" r="3"/><circle cx="740" cy="700" r="3"/>
      <circle cx="700" cy="720" r="3"/><circle cx="740" cy="720" r="3"/>
    </g>
  </g>

  <!-- furniture -->
  <g fill="none" stroke="#1C1A16" stroke-width="2" opacity=".55">
    <rect x="410" y="290" width="130" height="80"/>
    <rect x="430" y="300" width="50" height="60"/>
    <rect x="600" y="290" width="110" height="70"/>
    <rect x="760" y="290" width="110" height="70"/>
    <rect x="410" y="470" width="110" height="140"/>
    <rect x="410" y="570" width="50" height="40"/>
    <rect x="930" y="570" width="80" height="60"/>
    <rect x="600" y="680" width="40" height="40"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.6" fill="#1C1A16" opacity=".55">
    <text x="412" y="334">ROOM 01</text>
    <text x="610" y="334">ROOM 02</text>
    <text x="770" y="334">ROOM 03</text>
    <text x="412" y="550">DORM</text>
    <text x="930" y="620">SERVICE</text>
    <text x="930" y="340">ROOF TERRACE</text>
    <text x="684" y="784">ENTRY</text>
  </g>

  <!-- section marker -->
  <g stroke="#1C1A16" stroke-opacity=".6" fill="#1C1A16">
    <path d="M300 340h-30M300 648h-30M282 340v308"/>
    <path d="M282 340l-7 14h14zM282 648l-7-14h14z"/>
    <text x="266" y="500" transform="rotate(-90 266 500)" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2" stroke="none">A</text>
  </g>
  <g stroke="#1C1A16" stroke-opacity=".6" fill="#1C1A16">
    <path d="M1100 300h30M1100 700h30M1118 300v400"/>
    <path d="M1118 300l-7 14h14zM1118 700l-7-14h14z"/>
    <text x="1134" y="500" transform="rotate(90 1134 500)" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2" stroke="none">A</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(1220 150)">
    <circle r="24" fill="none" stroke="#1C1A16" stroke-opacity=".4"/>
    <path d="M0-18 8 8 0 3-8 8z" fill="#1C1A16" opacity=".7"/>
    <text y="-34" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1C1A16" opacity=".6">N</text>
  </g>

  <!-- notes -->
  <g transform="translate(940 800)">
    <text y="0" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2" fill="#1C1A16" opacity=".5">CONSERVATION NOTES</text>
    <text y="24" font-family="monospace" font-size="11" fill="#1C1A16" opacity=".6">· retain coral-stone walls</text>
    <text y="44" font-family="monospace" font-size="11" fill="#1C1A16" opacity=".6">· restore carved door + shutters</text>
    <text y="64" font-family="monospace" font-size="11" fill="#1C1A16" opacity=".6">· new services concealed</text>
  </g>

  <!-- title block -->
  <path d="M40 910h1320" stroke="#1C1A16" stroke-opacity=".4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#1C1A16" opacity=".6">
    <text x="60" y="948">OLD TOWN HOSTEL</text>
    <text x="60" y="972">MOMBASA, KENYA</text>
    <text x="620" y="948">DRAWING A-508</text>
    <text x="620" y="972">SCALE 1:100</text>
    <text x="1060" y="948">EDITH NDUTA KURIA</text>
    <text x="1060" y="972">2023</text>
  </g>
</svg>
