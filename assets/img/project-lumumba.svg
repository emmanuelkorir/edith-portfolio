      <path d="M672 478h150M672 504h150M672 530h150M672 556h150M672 582h150"/>
      <path d="M852 478h190M852 504h190M852 530h190M852 556h190M852 582h190"/>
    </g>
    <rect x="852" y="452" width="190" height="150" fill="#C58A51" opacity=".35"/>
  </g>

  <!-- courtyard / breeze screen -->
  <rect x="890" y="704" width="290" height="366" fill="#64735A"/>
  <rect x="890" y="704" width="290" height="366" fill="url(#c1-breeze)"/>
  <rect x="870" y="674" width="330" height="30" fill="#1C1A16"/>
  <rect x="870" y="704" width="20" height="366" fill="#4F5C48"/>
  <g stroke="#1C1A16" stroke-width="3" opacity=".45">
    <path d="M890 792h290M890 880h290M890 968h290"/>
  </g>

  <!-- tree in courtyard -->
  <g transform="translate(1130 760)">
    <path d="M-16 320c8-78 10-150 6-214" stroke="#4B3E2C" stroke-width="16" fill="none"/>
    <path d="M-10 172c-34-26-60-34-92-36M-8 146c30-20 52-46 66-78M-8 204c-30 2-54 16-74 40" fill="none" stroke="#4B3E2C" stroke-width="8"/>
    <g fill="#55654A">
      <circle cx="-90" cy="96" r="62"/>
      <circle cx="-18" cy="42" r="78"/>
      <circle cx="66" cy="74" r="58"/>
      <circle cx="-54" cy="158" r="52"/>
      <circle cx="24" cy="140" r="64"/>
    </g>
    <g fill="#6E7D5D">
      <circle cx="-58" cy="72" r="42"/>
      <circle cx="18" cy="82" r="48"/>
      <circle cx="-8" cy="128" r="34"/>
    </g>
    <g stroke="#1C1A16" stroke-opacity=".12" stroke-width="2" fill="none">
      <circle cx="-90" cy="96" r="62"/><circle cx="-18" cy="42" r="78"/><circle cx="66" cy="74" r="58"/>
    </g>
  </g>

  <!-- right low volume -->
  <rect x="1200" y="862" width="276" height="208" fill="#EFE7D6"/>
  <rect x="1200" y="840" width="300" height="22" fill="#1C1A16"/>
  <rect x="1240" y="898" width="196" height="172" fill="#31403B"/>
  <g stroke="#8EA098" stroke-width="2" opacity=".5">
    <path d="M1300 898v172M1360 898v172M1420 898v172"/>
  </g>

  <!-- terrace -->
  <rect y="1070" width="1600" height="130" fill="#C9B492"/>
  <path d="M0 1070h1600" stroke="#1C1A16" stroke-width="3"/>
  <g stroke="#1C1A16" stroke-opacity=".12">
    <path d="M0 1122h1600M0 1174h1600M120 1070v130M330 1070v130M540 1070v130M750 1070v130M960 1070v130M1170 1070v130M1380 1070v130"/>
  </g>

  <!-- plants -->
  <g fill="#5D6B50">
    <path d="M1090 1068c-14-32-10-60 10-84 12 30 8 58-10 84z"/>
    <path d="M1114 1068c-6-24 0-44 18-60 4 26-2 46-18 60z"/>
    <path d="M1066 1068c-8-20-4-38 8-52 4 20 0 36-8 52z"/>
  </g>
  <g transform="translate(1500 940)">
    <path d="M-34 128h68l-8 62h-52z" fill="#B46544"/>
    <g fill="#4E5C45">
      <path d="M0 128C-6 82-28 54-58 40c8 38 24 68 58 88z"/>
      <path d="M4 128C18 78 44 56 70 50 64 84 42 112 4 128z"/>
      <path d="M-2 126C-16 90-14 58 0 30c14 30 16 64 2 96z" fill="#647257"/>
    </g>
  </g>

  <!-- people -->
  <g fill="#1C1A16">
    <circle cx="800" cy="988" r="10"/>
    <path d="M790 1000h20l5 54h-30z"/>
    <path d="M795 1002l-7 52M805 1002l9 52" stroke="#1C1A16" stroke-width="5"/>
    <circle cx="848" cy="998" r="8"/>
    <path d="M840 1008h17l4 46h-25z"/>
    <path d="M843 1010l-5 44M852 1010l7 44" stroke="#1C1A16" stroke-width="4"/>
  </g>

  <!-- labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1C1A16">
    <text x="88" y="104" font-size="18" letter-spacing="4" opacity=".65">01 / RESIDENTIAL</text>
    <text x="88" y="136" font-size="15" letter-spacing="3.4" opacity=".5">LUMUMBA COURTYARD HOUSE</text>
    <text x="1512" y="1120" font-size="15" letter-spacing="3" text-anchor="end" opacity=".6">NAIROBI · 2025</text>
    <text x="1512" y="1150" font-size="13" letter-spacing="2.6" text-anchor="end" opacity=".45">SCALE 1:100 / SHEET A-01</text>
  </g>
  <g stroke="#1C1A16" stroke-opacity=".45">
    <path d="M140 1054v-18M790 1054v-18M140 1042h650"/>
    <path d="M140 1038v8M790 1038v8"/>
  </g>
</svg>
