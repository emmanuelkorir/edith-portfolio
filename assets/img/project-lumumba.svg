<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lumumba Courtyard House</title>
  <desc id="desc">Illustration of a two-storey courtyard house with a deep arched veranda, breeze-block screen and a mature tree at its centre.</desc>
  <defs>
    <pattern id="c1-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#1C1A16" stroke-opacity=".05"/>
    </pattern>
    <pattern id="c1-breeze" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#64735A"/>
      <circle cx="22" cy="22" r="10" fill="#E8E0CF"/>
      <path d="M22 0v9M22 35v9M0 22h9M35 22h9" stroke="#E8E0CF" stroke-width="7"/>
    </pattern>
    <pattern id="c1-grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".6" fill="#1C1A16" opacity=".3"/>
      <circle cx="5" cy="5.5" r=".5" fill="#1C1A16" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="#E8E0CF"/>
  <rect width="1600" height="880" fill="#DFD6C3"/>
  <rect width="1600" height="880" fill="url(#c1-grid)"/>
  <circle cx="1272" cy="238" r="146" fill="#BC6644"/>

  <!-- distant city -->
  <g fill="#B7BFA9" opacity=".7">
    <path d="M0 840V770h90v70zM120 840V730h70v110zM220 840V790h110v50zM360 840V744h60v96zM1180 840V764h90v76zM1300 840V796h100v44zM1430 840V748h70v92zM1520 840v-60h80v60z"/>
  </g>
  <path d="M0 840h1600" stroke="#1C1A16" stroke-opacity=".25"/>

  <!-- house left volume -->
  <rect x="170" y="388" width="470" height="452" fill="#D6C2A0"/>
  <rect x="170" y="388" width="470" height="452" fill="url(#c1-grain)" opacity=".18"/>
  <rect x="140" y="356" width="530" height="32" fill="#1C1A16"/>
  <rect x="140" y="388" width="530" height="10" fill="#BBA57F"/>
  <g>
    <rect x="214" y="452" width="104" height="186" fill="#2E2B24"/>
    <rect x="344" y="452" width="104" height="186" fill="#2E2B24"/>
    <rect x="474" y="452" width="104" height="186" fill="#2E2B24"/>
    <g stroke="#D6C2A0" stroke-width="3" opacity=".5">
      <path d="M214 480h104M214 508h104M214 536h104M214 564h104M214 592h104M214 620h104"/>
      <path d="M344 480h104M344 508h104M344 536h104M344 564h104M344 592h104M344 620h104"/>
      <path d="M474 480h104M474 508h104M474 536h104M474 564h104M474 592h104M474 620h104"/>
    </g>
    <rect x="474" y="452" width="104" height="186" fill="#C58A51" opacity=".4"/>
  </g>

  <!-- left ground floor veranda -->
  <rect x="170" y="840" width="470" height="230" fill="#EFE7D6"/>
  <rect x="170" y="840" width="234" height="230" fill="#332F27"/>
  <rect x="206" y="884" width="164" height="186" fill="#C58C53"/>
  <path d="M206 884h164v186H206z" fill="none" stroke="#1C1A16" stroke-opacity=".3" stroke-width="2"/>
  <path d="M206 976h164M288 884v186" stroke="#1C1A16" stroke-opacity=".22" stroke-width="2"/>

  <!-- central arch -->
  <path d="M632 1070V866a72 72 0 0 1 144 0v204z" fill="#B77F4C"/>
  <path d="M632 1070V866a72 72 0 0 1 144 0v204" fill="none" stroke="#1C1A16" stroke-width="3"/>
  <path d="M622 1070h164" stroke="#1C1A16" stroke-width="4"/>
  <path d="M632 972h144v98H632z" fill="#8C5D37" opacity=".65"/>
  <circle cx="704" cy="1000" r="10" fill="#1C1A16" opacity=".6"/>

  <!-- upper bridge volume -->
  <rect x="620" y="388" width="470" height="250" fill="#D6C2A0"/>
  <rect x="620" y="388" width="470" height="250" fill="url(#c1-grain)" opacity=".15"/>
  <rect x="596" y="356" width="518" height="32" fill="#1C1A16"/>
  <rect x="620" y="638" width="470" height="16" fill="#1C1A16"/>
  <rect x="620" y="654" width="470" height="8" fill="#BBA57F"/>
  <g>
    <rect x="672" y="452" width="150" height="150" fill="#2E2B24"/>
    <rect x="852" y="452" width="190" height="150" fill="#2E2B24"/>
