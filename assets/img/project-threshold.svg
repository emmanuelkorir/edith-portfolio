    <text x="88" y="136" font-size="15" letter-spacing="3.4" opacity=".5">THE SHARED THRESHOLD</text>
    <text x="1512" y="1120" font-size="15" letter-spacing="3" text-anchor="end" opacity=".6">JKUAT · 2025</text>
