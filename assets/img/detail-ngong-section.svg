<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ngong Road Workshops — section through the new insertion</title>
  <desc id="desc">A section drawing showing the existing brick warehouse and sawtooth roof with a new timber-framed workshop and mezzanine inserted inside.</desc>
  <defs>
    <pattern id="p3-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1C1A16" stroke-opacity=".045"/>
    </pattern>
    <pattern id="p3-brick" width="38" height="22" patternUnits="userSpaceOnUse">
      <rect width="38" height="22" fill="#A5553C"/>
      <path d="M0 11h38M19 0v11M0 11v11M38 11v11" stroke="#F3EDE0" stroke-opacity=".2" stroke-width="1.5"/>
    </pattern>
    <pattern id="p3-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v10" stroke="#1C1A16" stroke-opacity=".25" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1400" height="1000" fill="#F1EADB"/>
  <rect width="1400" height="1000" fill="url(#p3-grid)"/>
  <rect x="40" y="40" width="1320" height="920" fill="none" stroke="#1C1A16" stroke-opacity=".2"/>

  <text x="80" y="120" font-family="Georgia, serif" font-size="44" fill="#1C1A16">Keep the bones.</text>
  <text x="80" y="166" font-family="Georgia, serif" font-size="44" font-style="italic" fill="#A5553C">Change the life.</text>
  <text x="80" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.6" fill="#1C1A16" opacity=".55">TRANSVERSE SECTION C–C / 1:150</text>

  <!-- ground -->
  <path d="M80 720h1240v20H80z" fill="#D8C8A9"/>
  <path d="M80 740h1240" stroke="#1C1A16" stroke-width="4"/>
  <path d="M80 740h1240v40H80z" fill="url(#p3-hatch)" opacity=".4"/>

  <!-- existing shell -->
  <g>
    <rect x="180" y="420" width="1040" height="300" fill="#E7DCC7"/>
    <rect x="180" y="420" width="34" height="300" fill="url(#p3-brick)"/>
    <rect x="1186" y="420" width="34" height="300" fill="url(#p3-brick)"/>
    <path d="M180 420h1040" stroke="#1C1A16" stroke-width="4"/>
  </g>

  <!-- sawtooth roof -->
  <g>
    <path d="M180 420 335 300l155 120zM490 420 645 300l155 120zM800 420 955 300l155 120zM1110 420 1265 300l155 120z" fill="#4A504C"/>
    <path d="M180 420 335 300v120zM490 420 645 300v120zM800 420 955 300v120zM1110 420 1265 300v120z" fill="#646B66"/>
    <g stroke="#1C1A16" stroke-opacity=".35">
      <path d="M335 300v120M645 300v120M955 300v120M1265 300v120M180 420h1040"/>
    </g>
    <g fill="#D9CBAE" opacity=".65">
      <path d="M335 306v108h-96zM645 306v108h-96zM955 306v108h-96zM1265 306v108h-96z"/>
    </g>
  </g>

  <!-- new insertion -->
  <g>
    <rect x="520" y="470" width="460" height="250" fill="#F3EDE0"/>
    <rect x="520" y="470" width="460" height="250" fill="none" stroke="#C08A3E" stroke-width="8"/>
    <rect x="520" y="470" width="460" height="18" fill="#C08A3E"/>
    <rect x="520" y="608" width="460" height="14" fill="#C08A3E"/>
    <rect x="520" y="470" width="18" height="250" fill="#C08A3E"/>
    <rect x="962" y="470" width="18" height="250" fill="#C08A3E"/>
    <g stroke="#1C1A16" stroke-opacity=".28" stroke-width="2">
      <path d="M620 488v232M720 488v232M820 488v232M920 488v232"/>
      <path d="M538 560h424M538 650h424"/>
    </g>
    <g fill="#1C1A16" opacity=".65">
      <rect x="560" y="630" width="90" height="10"/>
      <rect x="572" y="640" width="7" height="30"/>
      <rect x="632" y="640" width="7" height="30"/>
      <rect x="760" y="516" width="80" height="50"/>
      <rect x="770" y="504" width="24" height="12"/>
      <rect x="806" y="504" width="22" height="12"/>
      <circle cx="880" cy="560" r="7"/>
      <path d="M873 568h14l3 34h-20z"/>
    </g>
    <g fill="#C08A3E" opacity=".55">
      <rect x="700" y="640" width="80" height="40"/>
      <rect x="840" y="640" width="90" height="40"/>
    </g>
  </g>

  <!-- mezzanine -->
  <g>
    <rect x="980" y="530" width="206" height="14" fill="#C08A3E"/>
    <rect x="980" y="544" width="206" height="8" fill="#8F6A35"/>
    <g stroke="#6E4A34" stroke-width="5">
      <path d="M1000 544v176M1080 544v176M1160 544v176"/>
    </g>
    <g fill="none" stroke="#1C1A16" stroke-width="2" opacity=".5">
      <path d="M990 530h186M990 510h186M990 510v20M1176 510v20"/>
      <path d="M1000 510v-14M1030 510v-14M1060 510v-14M1090 510v-14M1120 510v-14M1150 510v-14M1180 510v-14"/>
    </g>
    <g fill="#1C1A16" opacity=".7">
      <circle cx="1090" cy="490" r="7"/>
      <path d="M1083 498h14l3 18h-20z"/>
    </g>
  </g>

  <!-- stairs -->
  <g fill="#C08A3E">
    <path d="M960 720v-14h40v-14h40v-14h40v-14h40v-28h40v84z" opacity=".8"/>
  </g>
  <g stroke="#1C1A16" stroke-opacity=".3" stroke-width="2">
    <path d="M960 706h40M1000 692h40M1040 678h40M1080 664h40M1120 650h40"/>
  </g>

  <!-- pallet / workshop stuff -->
  <g fill="#6E4A34">
    <rect x="220" y="690" width="80" height="30"/>
    <rect x="310" y="700" width="60" height="20"/>
    <rect x="250" y="650" width="12" height="40"/>
    <rect x="270" y="650" width="12" height="40"/>
  </g>

  <!-- existing annotation -->
  <g stroke="#1C1A16" stroke-opacity=".4">
    <path d="M180 270v-40M1230 270v-40M180 250h1050"/>
    <path d="M197 420v-50M197 370h0M1186 420v-50"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#1C1A16" opacity=".55">
    <text x="205" y="238">EXISTING SAWTOOTH ROOF RETAINED</text>
    <text x="900" y="238" text-anchor="middle" opacity=".8">18.0 M</text>
    <text x="205" y="650" transform="rotate(-90 205 650)" text-anchor="middle">EXISTING BRICK</text>
    <text x="1280" y="650" transform="rotate(-90 1280 650)" text-anchor="middle">NEW TIMBER INSERTION</text>
  </g>
  <g fill="#A5553C">
    <rect x="900" y="760" width="16" height="16"/>
    <text x="926" y="774" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.8" fill="#1C1A16" opacity=".6">NEW WORK</text>
    <rect x="1060" y="760" width="16" height="16" fill="#A5553C" opacity=".6"/>
    <text x="1086" y="774" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.8" fill="#1C1A16" opacity=".6">EXISTING FABRIC</text>
  </g>

  <!-- title block -->
  <path d="M40 910h1320" stroke="#1C1A16" stroke-opacity=".4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.2" fill="#1C1A16" opacity=".6">
    <text x="60" y="948">NGONG ROAD WORKSHOPS</text>
    <text x="60" y="972">NAIROBI, KENYA</text>
    <text x="620" y="948">DRAWING A-311</text>
    <text x="620" y="972">SCALE 1:150</text>
    <text x="1060" y="948">EDITH NDUTA KURIA</text>
    <text x="1060" y="972">2024</text>
  </g>
</svg>
